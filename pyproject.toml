[project]
name = "diskshellhdd"
version = "0.8.1"
description = "Local-first storage management, analysis and safe disk tooling for Windows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "flask>=3.1,<4",
  "flask-cors>=6,<7",
  "humanize>=4.14,<5",
  "paramiko>=3.5,<5",
  "pymupdf>=1.26,<2",
  "py7zr>=1,<2",
  "pycdlib>=1.14,<2",
  "pillow>=11,<13",
  "psutil>=7,<8",
  "python-dotenv>=1.1,<2",
  "send2trash>=1.8,<2",
  "waitress>=3,<4",
  "pywin32>=311; sys_platform == 'win32'",
]

[project.optional-dependencies]
vision = [
  "numpy>=2,<3",
  "onnxruntime>=1.23,<2",
  "opencv-python-headless>=4.12,<5",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--basetemp=.pytest-tmp"]
